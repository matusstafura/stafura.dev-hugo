<!DOCTYPE html>
<html lang="{{ .Site.Language.Name }}">
{{- partial "head.html" . -}}
<body>
  {{- partial "tagmanager-body.html" . -}}
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-[70] btn">{{ i18n "skip_to_content" }}</a>
  <div class="mx-3 my-3 flex min-h-[calc(100dvh-1.5rem)] max-w-3xl flex-col border border-edge bg-paper sm:mx-auto sm:my-8 sm:min-h-[calc(100dvh-4rem)]">
    {{- partial "header.html" . -}}
    <main id="main" class="flex-1">
      {{- block "main" . }}{{- end }}
    </main>
    {{- partial "footer.html" . -}}
  </div>
  {{- partial "scripts.html" . -}}
</body>
</html>
