<div class="border-b border-line px-5 pb-8 pt-10 sm:px-8 sm:pt-14">
  {{- with .eyebrow }}<p class="label mb-4">{{ . | safeHTML }}</p>{{ end }}
  <h1 class="max-w-[22ch] text-balance text-4xl font-semibold leading-[1.08] tracking-tight sm:text-5xl">{{ .title }}</h1>
  {{- with .description }}<p class="mt-5 max-w-[60ch] text-pretty text-lg text-muted">{{ . }}</p>{{ end }}
  {{- with .extra }}<div class="mt-5">{{ . }}</div>{{ end }}
</div>
