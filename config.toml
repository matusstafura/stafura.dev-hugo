baseURL = "https://stafura.dev/"
title = "Matus Stafura"
enableRobotsTXT = true
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
  label = "English"
  locale = "en-US"
  weight = 1

    [[languages.en.menus.main]]
    name = "Home"
    url = "/"
    weight = 1

    [[languages.en.menus.main]]
    name = "Blog"
    url = "/posts"
    weight = 2

    [[languages.en.menus.main]]
    name = "Portfolio"
    url = "/portfolio"
    weight = 3

    [[languages.en.menus.main]]
    name = "About me"
    url = "/about"
    weight = 4

    [[languages.en.menus.main]]
    name = "GitHub"
    url = "https://github.com/matusstafura"
    weight = 5
    [languages.en.menus.main.params]
      external = true

    [[languages.en.menus.footer]]
    name = "Cookies"
    url = "/cookies"
    weight = 1

    [[languages.en.menus.footer]]
    name = "Privacy Policy"
    url = "/privacy-policy"
    weight = 2

  [languages.de]
  label = "Deutsch"
  locale = "de-DE"
  weight = 2
  [languages.de.params]
  description = "Matus Stafura schreibt über SEO, Marketing und Programmierung."

    [[languages.de.menus.main]]
    name = "Startseite"
    url = "/"
    weight = 1

    [[languages.de.menus.main]]
    name = "Blog"
    url = "/posts"
    weight = 2

    [[languages.de.menus.main]]
    name = "Portfolio"
    url = "/portfolio"
    weight = 3

    [[languages.de.menus.main]]
    name = "Über mich"
    url = "/about"
    weight = 4

    [[languages.de.menus.main]]
    name = "GitHub"
    url = "https://github.com/matusstafura"
    weight = 5
    [languages.de.menus.main.params]
      external = true

    # Cookies/Privacy Policy are legal documents and are only translated
    # once reviewed for legal accuracy, so these deliberately point at
    # the absolute English URL (Hugo's absLangURL leaves already-
    # absolute URLs untouched) rather than a non-existent /de/ page.
    [[languages.de.menus.footer]]
    name = "Cookies"
    url = "/cookies/"
    weight = 1

    [[languages.de.menus.footer]]
    name = "Datenschutzerklärung"
    url = "/privacy-policy/"
    weight = 2

[markup.highlight]
codeFences = true
lineNoStart = 1
noClasses = true
style = "dracula"

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[markup.goldmark]
renderer = { unsafe = true }

[sitemap]
changefreq = "monthly"
filename = "sitemap.xml"
priority = 0.5

[pagination]
pagerSize = 100

[params]
paginate = 5
date_format = "January 2, 2006"
showDarkModeToggle = true
ShowLanguageSelector = true
author = "Matus Stafura"
logo = "images/code.png"
favicon = "images/favicon/favicon.ico"
description = "Matus Stafura writes about SEO, marketing, and programming."
images = ["/images/home/og_home.jpg"]

  [params.plugins]
  # tagmanager = "GTM-XXXXXXX" via environment variable
  umami_website_id = "3841c281-0fa2-4c78-9105-6087965f208e"
  umami_src = "https://umami.53186567.xyz/script.js"
  umami_heatmap_src = "https://umami.53186567.xyz/recorder.js"

  [[params.social]]
  name = "GitHub"
  url = "https://github.com/matusstafura"

  [[params.social]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/matus-stafura/"

  [[params.social]]
  name = "dev.to"
  url = "https://dev.to/matusstafura"

  [[params.social]]
  name = "Bluesky"
  url = "https://bsky.app/profile/stafura.bsky.social"

  [params.posts]
  showPrevNext = true
  showDate = true
  showTags = true
  showCategories = true
  showRewrittenDate = true

[taxonomies]
tag = "tags"
category = "categories"

[params.person]
  name = "Matus Stafura"
