<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ .Site.Params.person.name }}",
  "url": "{{ .Site.BaseURL }}",
  "image": "{{ .Site.BaseURL }}{{ .Site.Params.person.image }}",
  "jobTitle": "{{ .Site.Params.person.jobTitle }}",
  "worksFor": {
    "@type": "Organization",
    "name": "{{ .Site.Params.person.company }}"
  },
  "knowsLanguage": [
    {{ range $i, $lang := .Site.Params.person.languages }}{{ if $i }},{{ end }}"{{ $lang }}"{{ end }}
  ],
  "knowsAbout": [
    {{ range $i, $skill := .Site.Params.person.skills }}{{ if $i }},{{ end }}"{{ $skill }}"{{ end }}
  ],
  "sameAs": [
    {{ range $i, $profile := .Site.Params.person.sameAs }}{{ if $i }},{{ end }}"{{ $profile }}"{{ end }}
  ]
}
</script>
